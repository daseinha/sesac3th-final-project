  // 있다 -- 생성 시점 번호는 고정하고, 삭제된 건 타임라인에 '몇 번째가
  // 삭제됨'으로 남기면 재넘버링이 필요 없다"). 남은 마커(힌트 아이콘) 정리는
  // 기존 cleanupOrphanedMarkers()를 그대로 재사용 -- 줄을 지웠을 때
  // (noteMarker.isConnected === false) 자동으로 걸러내는 로직이라 중복
  // 구현할 필요가 없음.
  function deleteSessionFromDom(sessionId, divider, ordinal, dayKey) {
    let removedLines = 0;
    let removedTodayLines = 0;
    noteBody.querySelectorAll(`[data-session-id="${sessionId}"]`).forEach((node) => {
      // "바로 물어보기" 표시줄(contentEditable=false)은 애초에 todayLineCount/
      // renderedCount 집계 대상이 아니었다(submitNote()만 그 카운트를 올림)
      // -- 그대로 지우되 집계에선 제외.
      if (node.contentEditable !== 'false') {
        removedLines++;
        if (node.dataset.isToday === '1') removedTodayLines++;
      }
      if (typingNode === node) typingNode = null;
      node.remove();
    });
    divider.innerHTML = buildTombstoneHtml(ordinal, dayKey);
    cleanupOrphanedMarkers();
    renderedCount = Math.max(0, renderedCount - removedLines);
    todayLineCount = Math.max(0, todayLineCount - removedTodayLines);
    updateNoteStatus();
  }

  function buildTombstoneHtml(ordinal, dayKey) {
    return `<span style="flex-shrink:0; font-style:italic;">${formatUnitLabel(dayKey)} · ${ordinal}번째 필기세션 삭제됨</span><span style="flex-grow:1; height:1px; background:var(--color-border);"></span>`;
  }

  // 새로고침 후 재구성(loadAllNotes)에서, 삭제된 세션 자리에 끼워 넣을
  // 묘비 구분선 -- insertSessionDivider()와 거의 같지만 삭제 버튼이 없고
  // (이미 지워진 세션이라 더 지울 게 없음), ordinal을 서버가 돌려준 값을
  // 그대로 신뢰해서 쓴다(새로 계산 안 함 -- 재넘버링 방지가 이 기능의
  // 핵심이므로).
  function insertDeletedSessionTombstone(t) {
    const unitKey = t.day_key;
    const isNewDay = unitKey !== lastUnitKey;
    if (isNewDay) insertUnitDivider(unitKey, lastUnitKey);
    lastUnitKey = unitKey;
    if (sessionOrdinalDayKey !== unitKey) {
      sessionOrdinalToday = 0;
      sessionOrdinalDayKey = unitKey;
    }
    sessionOrdinalToday = Math.max(sessionOrdinalToday, t.ordinal);
    lastSessionId = null; // 삭제된 세션이니 이후 실제 세션과는 항상 "다르다"고 판단되면 됨

    const divider = document.createElement('div');
    divider.style.cssText = 'display:flex; align-items:center; gap:10px; margin:30px 0 22px; color:var(--color-text-muted); font-size:12.5px;';
    divider.contentEditable = 'false';
    divider.innerHTML = buildTombstoneHtml(t.ordinal, unitKey);
    noteBody.appendChild(divider);
  }

  let lastUnitKey; // undefined = 아직 아무 필기도 안 그려짐(첫 블록 라벨도 보여주기 위한 구분)

  // 세션 경계 재구성용 상태(2026-10-08) -- 날짜 구분선과 별개로, 같은 날
  // 안에서 note.session_id가 바뀌는 지점에 "N번째 필기" 구분선을 끼워
  // 넣는다. 전엔 session_id가 DB엔 남아도(중복 힌트 방지용) 화면 재구성에는
  // 안 쓰여서, 새로고침하면 같은 날 여러 세션이 다시 하나로 뭉쳐 보였음
  // (사용자 지적: "제목엔 새 필기 시작이라고 표시되는데 저장은..."). 과거
  // 재생 데이터처럼 session_id가 아예 없는 줄은 건드리지 않는다.
  let lastSessionId = null;
  let sessionOrdinalToday = 0; // sessionOrdinalDayKey 기준 "오늘" 몇 번째 세션인지
  let sessionOrdinalDayKey; // 위 카운터가 어느 날짜(unitKey)에 대한 것인지

  // "새 필기 시작" -- 언제든(상시 노출) 눌러서 지금 이 자리에 새 세션 구분선을
  // 찍고 세션ID를 새로 발급한다(2026-10-08). 날짜가 같아도 동작함 -- 날짜
  // 구분선(insertUnitDivider)과는 별개로, "세션" 단위는 날짜보다 더 잘게
  // 나뉠 수 있다는 요청 반영. autoTriggered=true면 "필기 종료"로 정상 종료한
  // 뒤 재시작했을 때 자동으로 호출된 경우 -- 원치 않으면 되돌릴 수 있게
  // "이어서 쓰기" 링크를 같이 보여준다(수동으로 누른 경우엔 안 보여줌,
  // 본인이 의도한 동작이라 되돌릴 필요가 없음).
  function startNewSession({ autoTriggered = false } = {}) {
    SESSION_ID = crypto.randomUUID();
    sessionTestMode = false; // 새 세션은 기본적으로 테스트 모드 아님(이전 세션 설정이 안 넘어옴)

    const now = new Date();
    const todayKey = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
    // 세션 카운터는 "오늘(todayKey)" 기준 -- 자정을 넘기고 처음 누르는
    // 거라면 0부터 다시 센다. lastSessionId도 같이 리셋해서, 날짜가 바뀐
    // 뒤 첫 세션은 무조건 ordinal 1(= "새 필기 시작" 문구)이 되게 한다.
    if (sessionOrdinalDayKey !== todayKey) {
      sessionOrdinalToday = 0;
      sessionOrdinalDayKey = todayKey;
    }
    sessionOrdinalToday += 1;
    lastSessionId = SESSION_ID;

    const divider = document.createElement('div');
    divider.style.cssText = 'display:flex; align-items:center; gap:10px; margin:30px 0 22px; color:var(--color-text-muted); font-size:12.5px;';
    divider.contentEditable = 'false';
    const dateLabel = formatUnitLabel(todayKey);
    const timeLabel = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    // 오늘의 첫 세션(=ordinal 1)은 날짜 구분선을 겸할 수도 있어서 기존
    // "새 필기 시작" 문구를 유지하고, 같은 날 두 번째부터는 "N번째 필기"로
    // -- 사용자 요청(2026-10-08): "구분선 제목에 아예 몇 번째 필기인지
    // 반영돼야 하지 않나". 새로고침 후 재구성되는 쪽(insertSessionDivider)과
    // 같은 번호 체계를 공유한다.
    const label = sessionOrdinalToday === 1
      ? `${dateLabel} ${timeLabel} · 새 필기 시작`
      : `${dateLabel} ${timeLabel} · ${sessionOrdinalToday}번째 필기`;
    divider.innerHTML = `<span style="flex-shrink:0; font-weight:600;">${label}</span><span style="flex-grow:1; height:1px; background:var(--color-border);"></span>`;

    if (autoTriggered) {
      const resumeBtn = document.createElement('button');
      resumeBtn.textContent = '이어서 쓰기';
      resumeBtn.title = '방금 전 내용과 이어서 쓰기 (이 구분선 취소)';
      resumeBtn.style.cssText = 'flex-shrink:0; background:var(--color-surface-muted); border:1px solid var(--color-border-input); color:var(--color-ink); border-radius:999px; padding:4px 11px; font-size:11.5px; cursor:pointer;';
      resumeBtn.onclick = (ev) => {
        ev.stopPropagation();
        divider.remove(); // 구분선만 취소 -- 세션ID는 그대로 둠(순수 표시 취소, 기능엔 영향 없음)
      };
      divider.appendChild(resumeBtn);
    }

    // 날짜 구분선과 합쳐지는 그날 첫 세션(ordinal 1)에는 안 붙인다 --
    // insertSessionDivider()와 같은 이유(위 설명 참고).
    if (sessionOrdinalToday > 1) {
      divider.appendChild(makeDeleteSessionBtn(SESSION_ID, divider, sessionOrdinalToday, todayKey));
    }

    noteBody.appendChild(divider);
    // 다음에 들어오는 같은 날짜 필기가 날짜 구분선을 또 찍지 않도록(중복 방지)
    // -- 날짜 구분선 로직의 "마지막 본 날짜" 기억을 오늘로 갱신해둔다.
    lastUnitKey = todayKey;

    // 구분선(div)만 추가하고 noteBody.focus()만 호출하면, 캐럿이 구분선
    // "아래"가 아니라 예전 캐럿 위치(구분선 위, 마지막 필기 줄)에 그대로
    // 남아있었다(2026-10-08 실측, 스크린샷으로 확인) -- 구분선은
    // contentEditable=false라 캐럿이 들어갈 수 없는 자리라서 생긴 문제.
    // focusNewLineAtEnd()로 구분선 바로 다음에 빈 줄을 만들고 캐럿을 거기로
    // 명시적으로 옮긴다("맨 아래로" 버튼 고칠 때와 같은 방식).
    focusNewLineAtEnd();

    // "새 페이지" 효과 재사용(loadAllNotes와 같은 트릭) -- 커서 위치를 이
    // 구분선 바로 아래, 화면 맨 위로.
    noteScroll.style.paddingBottom = noteScroll.clientHeight + 'px';
    noteScroll.scrollTo({ top: noteScroll.scrollHeight });
  }

  function formatClock(iso) {
    const d = iso ? new Date(iso) : new Date();
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function renderNote(n) {
    const unitKey = noteUnitKey(n);
    const isNewDay = unitKey !== null && unitKey !== lastUnitKey;
    if (isNewDay) insertUnitDivider(unitKey, lastUnitKey);
    // unitKey가 null인 줄(실시간 타이핑/바로 물어보기처럼 날짜 구분이 없는
    // 필기)은 lastUnitKey를 건드리지 않는다 -- 건드리면 그 사이에 null 줄이
    // 하나라도 끼는 순간 "현재 날짜" 기억이 끊겨서, 바로 다음 같은 날짜의
    // sim 줄이 다시 날짜가 바뀐 것처럼 오인돼 구분선이 중복으로 또 찍힘
    // (2026-10-02 실측 버그 -- 테스트용으로 띄운 live 필기가 날짜 그룹 추적을
    // 깨뜨린 사례로 발견).
    if (unitKey !== null) lastUnitKey = unitKey;
    maybeInsertSessionDivider(n, unitKey, isNewDay);

    const p = document.createElement('p');
    p.style.margin = '0 0 1.4em';
    p.textContent = n.content;
    // 서버가 돌려준 client_line_id를 그대로 이어받는다 -- 복원된 이 줄을
    // 또 고쳐서 재제출해도(submitNote) 같은 줄로 계속 인식되어야, 새로고침을
    // 여러 번 거쳐도 중복 없이 "최신 버전 하나"만 남는다(2026-10-02).
    if (n.client_line_id) p.dataset.lineId = n.client_line_id;
    p.dataset.time = formatClock(n.created_at);
    // 세션 삭제 버튼이 DOM에서 바로 이 줄을 찾아 지울 수 있게 session_id를
    // 같이 달아둔다(2026-10-08, deleteSessionFromDom 참고).
    if (n.session_id) p.dataset.sessionId = n.session_id;
    if (isToday(n.created_at)) p.dataset.isToday = '1';
    noteBody.appendChild(p);
    return n.tier2_result ? { ...addMarkerPair(p, n.tier2_result, 'hint', n.origin_ref, n.tier2_sources), text: n.tier2_result } : null;
  }

  // renderNote()와 거의 같지만, 에이전트단 마커(agentMarker)의 위치 계산
  // (node.offsetTop 읽기)을 하지 않고 노트단 마커(noteMarker)만 붙여서
  // 반환한다 -- loadAllNotes()가 수천 줄을 한꺼번에 불러올 때, "쓰기 하나당
  // 읽기 하나"씩 번갈아 하면 매번 강제 레이아웃 재계산이 걸려 느려지는 걸
  // 피하려고 씀(아래 loadAllNotes 참고, 2026-10-08 실측).
  function renderNoteFast(n) {
    const unitKey = noteUnitKey(n);
    const isNewDay = unitKey !== null && unitKey !== lastUnitKey;
    if (isNewDay) insertUnitDivider(unitKey, lastUnitKey);
    if (unitKey !== null) lastUnitKey = unitKey;
    maybeInsertSessionDivider(n, unitKey, isNewDay);

    const p = document.createElement('p');
    p.style.margin = '0 0 1.4em';
    p.textContent = n.content;
    if (n.client_line_id) p.dataset.lineId = n.client_line_id;
    p.dataset.time = formatClock(n.created_at);
    if (n.session_id) p.dataset.sessionId = n.session_id;
    if (isToday(n.created_at)) p.dataset.isToday = '1';
    noteBody.appendChild(p);

    if (!n.tier2_result) return null;

    const noteMarker = document.createElement('button');
    noteMarker.innerHTML = lightbulbSvg;
    noteMarker.setAttribute('aria-label', '이 필기에 대한 코멘트 보기');
    noteMarker.style.cssText = 'display:inline-flex; vertical-align:middle; margin-left:6px; padding:2px; background:none; border:none; cursor:pointer; opacity:0.75;';
    noteMarker.contentEditable = 'false'; // addMarkerPair와 동일한 이유(위 주석 참고)
    p.appendChild(noteMarker);

    return { p, noteMarker, text: n.tier2_result, isToday: isToday(n.created_at), originRef: n.origin_ref, tier2Sources: n.tier2_sources };
  }

  // 실제 캘린더 날짜(로컬) 기준 "오늘"인지 -- 날짜 구분선과는 별개로, 하단
  // 상태줄의 "오늘(지금 세션)" 통계 집계용(2026-10-08). 재생 데이터(sim:)는
  // created_at이 재생을 실행한 시각(예: 작업한 실제 날)이라 오늘 날짜와
  // 다르면 자연히 빠짐 -- 과거 히스토리가 "오늘" 통계에 안 섞이는 이유.
  function isToday(iso) {
    if (!iso) return false;
    const d = new Date(iso);
    const now = new Date();
    return d.getFullYear() === now.getFullYear()
      && d.getMonth() === now.getMonth()
      && d.getDate() === now.getDate();
  }

  // 전체(이 과목 히스토리 전체) 줄 수/힌트 수 -- 폴링 중복 판정에도 쓰임.
  let renderedCount = 0;
  let tier2HintCount = 0;
  // 오늘(지금 세션) 줄 수/힌트 수 -- 2026-10-08, 57일 전체 입력테스트가 끝나고
  // 전체 히스토리를 불러오게 되면서 "오늘" 통계가 묻혀버려서 추가. 하단
  // 상태줄은 기본으로 이걸 보여주고, 클릭하면 위 전체 통계와 토글된다
  // (사용자 요청: "디폴트값이 지금 필기세션 통계").
  let todayLineCount = 0;
  let todayHintCount = 0;
  let showAllStats = false; // 토글 상태 -- false면 오늘, true면 전체

  // 필기단 하단 상태줄("오늘 N개 필기 · 마지막 저장 N초 전") -- 원래
  // 목업에 있던 정적 텍스트("오늘 11개 필기 · 마지막 저장 3초 전")가
  // 실제로는 한 번도 갱신 안 되고 그대로 박혀있던 걸 발견(2026-10-02
  // 지적) -- 아까 에이전트단 상태 메시지 고친 것과 같은 문제라, 여기도
  // 실제 필기 동작 로그로 바꾼다.
  let lastSavedAt = null;

  function formatRelativeTime(date) {
    const sec = Math.floor((Date.now() - date.getTime()) / 1000);
    if (sec < 5) return '방금 전';
    if (sec < 60) return `${sec}초 전`;
    const min = Math.floor(sec / 60);
    if (min < 60) return `${min}분 전`;
    return `${Math.floor(min / 60)}시간 전`;
  }

  function updateNoteStatus() {
    // 줄/의미단위로 쪼개 저장하는 구조라 "N개 필기"보다 "N줄"이 더 정확
    // (2026-10-02 지적). 힌트 개입 줄 수도 같이 보여줘서, "쓸수록 조용해짐"
    // (개인화 효과)을 사용자가 실시간으로 체감할 수 있게 함(2026-10-02,
    // "추가할 수 있는 정보가 있으면 좋겠다"는 요청 반영). 2026-10-08: 기본은
    // "오늘(지금 세션)" 통계, 클릭하면 "전체" 누적 통계로 토글(57일 입력
    // 테스트가 끝나서 전체 히스토리가 항상 보이게 된 뒤로, 오늘 통계가
    // 묻히지 않게).
    const lines = showAllStats ? renderedCount : todayLineCount;
    const hints = showAllStats ? tier2HintCount : todayHintCount;
    const label = showAllStats ? '전체' : '오늘';
    const countPart = lines
      ? `${label} ${lines}줄 필기 · 그중 ${hints}줄에 힌트`
      : `${label} 0줄 필기`;
    noteStatusText.textContent = lastSavedAt
      ? `${countPart} · 마지막 저장 ${formatRelativeTime(lastSavedAt)}`
      : countPart;
  }
  setInterval(updateNoteStatus, 1000); // 저장이 없어도 "N초 전"이 계속 흘러가야 함

  noteStatusText.style.cursor = 'pointer';
  noteStatusText.title = '클릭하면 오늘/전체 통계를 번갈아 봅니다';
  noteStatusText.addEventListener('click', () => {
    showAllStats = !showAllStats;
    updateNoteStatus();
  });

  // 페이지를 새로고침하거나 서비스를 재시작해도 가짜 데모 문단이 아니라,
  // 이 과목에 실제로 쓴 필기 전체를 그대로 복원한다. 하나도 없으면 정말
  // 빈 화면으로 시작(2026-10-02, "새로고침하면 데모 텍스트가 계속 보이는
  // 게 이상하다"는 지적 반영). 예전엔 "오늘 쓴 것만" 복원했는데(구 이름
  // loadTodayNotes), 하루 지나 다시 켜면 화면이 또 텅 비어서 "이어서 쓰는
  // 필기장"이라는 서비스 취지와 안 맞는다는 지적으로 날짜 제한을
  // 없앴다(2026-10-08, api.py의 get_all_notes() 참고).
  // 서버가 일시적으로 안 받아주거나(재시작 중/DB 락 등) 응답이 평소보다
  // 오래 걸리면, 그냥 fetch는 사용자 입장에서 "필기 불러오는 중..."이 영원히
  // 안 끝나는 것처럼 보인다(2026-10-09 실측: 서버 재배포 타이밍과 겹쳐 로딩
  // 화면이 멈춘 것처럼 보였던 사례 -- 끄기 버튼도 응답이 없어 당황스러웠을
  // 것). 일정 시간 안에 응답이 없으면 스스로 포기하고 에러로 처리하도록
  // AbortController로 타임아웃을 건다.
  async function fetchWithTimeout(url, timeoutMs = 15000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  async function loadAllNotes() {
    const [notesRes, tombstonesRes] = await Promise.all([
      fetchWithTimeout(`/api/all_notes?course_id=${encodeURIComponent(COURSE_ID)}`),
      fetchWithTimeout(`/api/deleted_sessions?course_id=${encodeURIComponent(COURSE_ID)}`),
    ]);
    const notes = await notesRes.json();
    const tombstones = await tombstonesRes.json();

    // 실제 필기 + 삭제된 세션 묘비를 시간순으로 합쳐서 하나의 타임라인으로
    // 돈다(2026-10-08) -- 묘비는 note_chunks에 흔적이 안 남으므로 별도
    // 테이블(deleted_sessions)에서 가져와 session_started_at(삭제 시각이
    // 아니라 그 세션이 원래 시작됐던 시각) 기준으로 끼워 넣어야, 그 세션이
    // 있던 바로 그 자리에 "N번째 필기세션 삭제됨"이 나타난다.
    const timeline = [
      ...notes.map((n) => ({ kind: 'note', data: n, t: n.created_at })),
      ...tombstones.map((t) => ({ kind: 'tombstone', data: t, t: t.session_started_at })),
    ].sort((a, b) => new Date(a.t) - new Date(b.t));

    // 성능(2026-10-08 실측, 2,400여 줄 기준 체감 지연 확인): renderNote()를
    // 그대로 수천 번 돌리면 "문단 쓰기 -> offsetTop 읽기"가 매 줄마다
    // 번갈아 일어나서, 매번 브라우저가 레이아웃을 강제로 다시 계산한다
    // (읽기/쓰기를 번갈아 하는 패턴 -- "레이아웃 스래싱"). 쓰기(문단/
    // 노트단 마커 생성)를 전부 끝내고, 레이아웃 읽기(에이전트단 마커 위치
    // 계산)는 맨 마지막에 한 번만 몰아서 처리 -- 읽기 전에 쓰기가 안
    // 섞이면 레이아웃은 딱 한 번만 계산되고 이후 읽기는 캐시를 그대로 씀.
    const pending = [];
    timeline.forEach(({ kind, data }) => {
      if (kind === 'tombstone') { insertDeletedSessionTombstone(data); return; }
      const r = renderNoteFast(data);
      if (r) pending.push(r);
    });
    const diff = viewportOffsetDiff(); // 읽기 전용 구간 시작
    pending.forEach(({ p, noteMarker, text, isToday, originRef, tier2Sources }) => {
      const agentMarker = document.createElement('button');
      agentMarker.innerHTML = lightbulbSvg;
      agentMarker.setAttribute('aria-label', '이 필기에 대한 코멘트 보기');
      agentMarker.style.cssText = `position:absolute; left:0; top:${p.offsetTop + diff}px; padding:2px; background:none; border:none; cursor:pointer; opacity:0.75;`;
      hintTrack.appendChild(agentMarker);
      wireMarkerPair(noteMarker, agentMarker, text, 'hint', { skipUIUpdate: true, isToday, originRef, tier2Sources });
    });
    hintTrack.style.height = noteBody.scrollHeight + 'px';
    todayLineCount = notes.filter((n) => isToday(n.created_at)).length;

    renderedCount = notes.length;
    // 복원 시점엔 "방금 저장함"이 아니라 서버에 찍힌 실제 마지막 저장
    // 시각을 써야 상대시간이 정확함(새로고침했다고 0초 전으로 보이면 안 됨).
    if (notes.length) lastSavedAt = new Date(notes[notes.length - 1].created_at);
    updateHintBadge();
    updateNoteStatus();

    const loadingNotice = document.getElementById('note-loading');
    if (loadingNotice) loadingNotice.remove();

    // 새로고침 버튼으로 들어온 경우, 새 페이지에서도 그 버튼이 계속 "처리 중"
    // 상태로 보여야 한다(2026-10-08 지적 -- 버튼이 눌리자마자 페이지가 통째로
    // 새로 열려서 버튼 자체의 상태 변화가 안 보였음). sessionStorage로 넘겨서
    // 이 페이지가 열린 직후부터 복원해뒀다가(아래 참고), 로딩이 끝난 지금
    // 원래 상태로 되돌린다.
    try { sessionStorage.removeItem('notemate_reloading'); } catch (e) {}
    hardResetBtn.disabled = false;
    hardResetIcon.classList.remove('spinning');

    // "새 페이지" 효과(화면이 빈 것처럼 보이게, 커서를 화면 맨 위에 두고
    // 아래는 아직 비어 보임)는 "필기 종료" 버튼으로 정상 종료한 뒤 재시작한
    // 경우에만 쓴다(2026-10-08 사용자 지적 -- 처음엔 모든 로드에 이 효과를
    // 썼는데, "단순 새로고침까지 이러면 안 된다. 직전에 보던 화면 위치가
    // 그대로 유지되는 게 직관적"이라는 피드백으로 분기). 그 경우가 아니면
    // (단순 새로고침/화면지우기/비정상 종료 후 재진입) 직전에 보던 스크롤
    // 위치를 그대로 복원 -- 기록된 적이 없으면(이 과목 첫 진입) 최신 내용이
    // 보이는 게 자연스러우니 그냥 맨 아래로.
    try {
      if (localStorage.getItem('notemate.cleanExit')) {
        localStorage.removeItem('notemate.cleanExit');
        // 브라우저는 실제 콘텐츠 끝보다 더 아래로는 못 스크롤하므로(스크롤
        // 가능 범위가 콘텐츠 높이까지로 고정), 뷰포트 높이만큼 임시 여백을
        // 맨 아래에 붙여서 "커서 위치가 화면 맨 위"가 되는 지점까지 스크롤이
        // 가능하게 만든다. 실제로 타이핑을 시작하면(input 이벤트에서 제거)
        // 여백은 사라지고 평소처럼 자연스럽게 아래로 스크롤되며 이어진다.
        noteScroll.style.paddingBottom = noteScroll.clientHeight + 'px';
        noteScroll.scrollTo({ top: noteScroll.scrollHeight });
        startNewSession({ autoTriggered: true });
      } else {
        const savedTop = Number(localStorage.getItem(SCROLL_POS_KEY()));
        if (!Number.isNaN(savedTop)) {
          noteScroll.scrollTop = savedTop;
        } else {
          noteScroll.scrollTop = noteScroll.scrollHeight;
        }
      }
    } catch (e) {}
  }

  // 외부(재생 스크립트 등)에서 백엔드로 직접 넣은 필기도, 브라우저를 새로고침
  // 안 해도 자동으로 화면에 나타나게 주기적으로 확인한다 -- 사용성
  // 테스트에서 "입력 -> 화면 반응"을 실시간으로 지켜볼 수 있어야 하므로
  // (2026-10-02, 날짜별 순차 투입 리뷰 테스트를 위해 추가).
  async function pollForNewNotes() {
    const res = await fetch(`/api/all_notes?course_id=${encodeURIComponent(COURSE_ID)}`);
    const notes = await res.json();
    if (notes.length > renderedCount) {
      const newNotes = notes.slice(renderedCount);
      let latestPair = null;
      newNotes.forEach((n) => { const pair = renderNote(n); if (pair) latestPair = pair; });
      renderedCount = notes.length;
      todayLineCount += newNotes.length; // 폴링으로 막 나타난 줄도 항상 "오늘"
      lastSavedAt = new Date();
      updateNoteStatus();
      // 한 번에 여러 줄이 들어와도 알림은 가장 최근 넛지 하나만 펼친다 -- 여러 개를
      // 동시에 펼치면 화면이 겹침(2026-10-03).
      if (latestPair) {
        showHintPopover(latestPair.agentMarker, latestPair.text, 'hint', { notice: true, autoCloseMs: 500 });
      }

      // submitNote()는 브라우저에서 직접 타이핑했을 때만 타는 경로라, 재생
      // 스크립트처럼 외부에서 바로 DB에 넣은 필기는 폴링으로만 화면에
      // 나타나고 상태 메시지는 그대로 "지켜보는 중"에 멈춰 있었다(2026-10-02
      // 실측 버그 -- "바로 물어보기는 바뀌는데 일반 필기는 안 바뀐다"는
      // 지적). 이 경우 처리는 이미 끝난 뒤라 "생각 중" 단계를 보여줄 수는
      // 없고, 결과가 도착한 순간의 "완성" 단계부터 표시한다.
      const hintCount = newNotes.filter((n) => n.tier2_result).length;
      if (hintCount > 0) {
        setAgentStatus(`힌트 ${hintCount}개 작성 완료`, { autoReset: true });
      } else {
        setAgentStatus('새 필기 확인 완료', { autoReset: true });
      }

      if (isNearBottom(noteScroll) || typingNode === null) {
        noteScroll.scrollTo({ top: noteScroll.scrollHeight, behavior: 'smooth' });
      }
    }
  }
  setInterval(pollForNewNotes, 3000);

  // 실패해도(타임아웃/네트워크 끊김 등) "필기 불러오는 중..."이 영원히
  // 떠있지 않게, 실패를 눈에 보이는 에러 + 재시도 버튼으로 바꾼다
  // (2026-10-09 실측 -- 원인 불명의 로딩 멈춤이 있었는데, 끄기 버튼까지
  // 먹통처럼 보여서 당황스러웠다는 지적 반영. 근본 원인은 서버 재배포
  // 타이밍과 겹친 걸로 추정되지만, 어떤 이유로든 또 실패하면 이젠 최소한
  // "멈춘 게 아니라 실패했고 다시 시도할 수 있다"는 게 보임).
  loadAllNotes().catch((e) => {
    console.error('loadAllNotes 실패:', e);
    const loadingNotice = document.getElementById('note-loading');
    if (loadingNotice) {
      loadingNotice.innerHTML =
        '<span style="color: var(--color-danger);">필기를 불러오지 못했어요 -- 서버 연결을 확인해주세요.</span>' +
        '<button onclick="location.reload()" style="margin-left:8px; background:var(--color-surface); border:1px solid var(--color-border-input); border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer;">다시 시도</button>';
    }
  });

  // 테스트 전용: DB는 그대로 두고 화면(필기창 + 마커 + 팝오버)만 비운다.
  // renderedCount는 일부러 안 건드린다 -- 서버엔 이미 저장돼 있는 필기들이라,
  // 0으로 리셋하면 3초 폴링이 "아직 안 그려진 새 필기"로 오인해서 금방
  // 다시 그려버림(2026-10-02). 나중에 이 버튼을 빼면 이 블록도 같이 지우면 됨.
  clearScreenBtn.addEventListener('click', () => {
    closeHintPopover();
    noteBody.innerHTML = '';
    hintTrack.innerHTML = '';
    markerPairs.length = 0;
    hintTrack.style.height = '0px';
    typingNode = null;
    lastUnitKey = undefined; // 화면이 비었으니 다음에 뭐가 오든 구분선부터 다시 보여줌
    lastSessionId = null;
    sessionOrdinalToday = 0;
    sessionOrdinalDayKey = undefined;
    updateHintBadge();
    noteBody.focus();
  });

  // 캐시 걱정 없이 완전히 새로 불러오기 -- URL에 매번 다른 쿼리를 붙여서
  // 브라우저가 어떤 캐시도 재사용할 수 없는 "새 요청"으로 만든다
  // (location.reload()만으론 브라우저별 캐시 정책에 따라 100% 보장이
  // 안 될 수 있어서, 쿼리스트링 방식이 가장 확실함).
  hardResetBtn.addEventListener('click', () => {
    // 클릭 직후 페이지가 통째로 새로 불러와지기까지 공백이 있어서, 버튼이
    // 멈춘 것처럼 보였다(2026-10-08 지적). 네비게이션이 실제로 끝나기
    // 전까지는 이전 페이지가 그대로 보이니, 그 틈에 버튼 자체를 "처리 중"
    // 상태로 바꿔서 반응이 있다는 걸 보여준다.
    hardResetBtn.disabled = true;
    hardResetIcon.classList.add('spinning');
    // 페이지가 통째로 새로 열리면 이 JS 상태는 전부 사라지니, 새 페이지가
    // 열린 직후 스스로 같은 "처리 중" 상태를 복원할 수 있게 플래그를
    // sessionStorage에 남겨둔다(2026-10-08, "새로고침 되는 동안 버튼 자체가
    // 계속 그 상태로 보이면 좋겠다"는 요청) -- 위 const hardResetBtn 선언
    // 바로 아래에서 이 플래그를 읽어서 복원함.
    try { sessionStorage.setItem('notemate_reloading', '1'); } catch (e) {}
    location.href = location.pathname + '?_=' + Date.now();
  });

  function isNearBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight < NEAR_BOTTOM_PX;
  }

  // noteScroll.scrollHeight로 바로 스크롤하면 "새 페이지" 효과(loadAllNotes/
  // startNewSession)가 아직 안 지워진 상태일 때 그 가짜 여백까지 스크롤돼서
  // 진짜 내용이 아니라 빈 화면이 보이는 버그가 있었다(2026-10-08 실측) --
  // scrollIntoView는 그 가짜 여백과 무관하게 실제 요소 위치로만 스크롤하므로
  // 이 문제가 없다. 두 함수 다 이 방식을 쓴다.
  // noteBody.focus()를 호출하면 아래 focus 리스너(jumpToLive)가 같이 발동해서
  // "지금 쓰던 곳"으로 다시 스크롤해버리는 문제가 있었다(2026-10-08 실측:
  // "맨 아래로"를 눌러도 스크롤했다가 focus 때문에 즉시 typingNode 위치로
  // 되돌아가, 결과적으로 "지금 쓰던 곳으로"만 작동하는 것처럼 보였음) --
  // 이 플래그로 그 자동 되돌림을 일시적으로 막는다. focus()는 synchronous하게
  // 리스너를 호출하므로 true/false 토글 사이에서 안전하게 걸린다.
  let suppressAutoJump = false;

  // scrollIntoView()는 오늘 두 번이나(각각 다른 상황에서) 신뢰할 수 없는
  // 걸로 드러났다 -- (1) "맨 아래로": 새로 만든 빈 줄을 뷰포트 바닥에 딱
  // 붙여서 캐럿이 가려짐, (2) "새 필기 시작" 직후 한 줄씩 입력/Enter를 쳐도
  // 화면이 전혀 안 따라 내려감(2026-10-08 실측, 둘 다 스크린샷으로 확인) --
  // 두 경우 다 직전에 paddingBottom 같은 레이아웃이 급격히 바뀐 직후라는
  // 공통점이 있어, scrollIntoView의 내부 가시성 판정을 못 믿고 좌표를 직접
  // 계산하는 방식으로 아예 교체한다. getBoundingClientRect()는 호출 시점에
  // 항상 최신 레이아웃을 강제로 반영하므로 이런 레이아웃 변경 직후에도
  // 안전하다.
  function scrollNodeIntoView(el, margin = 24) {
    if (!el) return;
    const elRect = el.getBoundingClientRect();
    const boxRect = noteScroll.getBoundingClientRect();
    const overflowBelow = elRect.bottom - boxRect.bottom;
    const overflowAbove = boxRect.top - elRect.top;
    if (overflowBelow > -margin) {
      noteScroll.scrollTop += overflowBelow + margin;
    } else if (overflowAbove > -margin) {
      noteScroll.scrollTop -= overflowAbove + margin;
    }
  }

  function jumpToTypingNode() {
    // "지금 쓰던 곳"(입력 중이던 그 줄) -- 문서 중간을 고치던 중이면 거기로.
    // 매 입력(Enter 포함)마다 jumpToLive()를 통해 이 함수가 다시 호출되므로,
    // "타이핑을 따라가는 자동 스크롤"도 결국 이 함수 하나가 담당한다.
    scrollNodeIntoView(typingNode);
    closeHintPopover();
    suppressAutoJump = true;
    noteBody.focus();
    suppressAutoJump = false;
  }

  function jumpToBottom() {
    // "맨 아래로" -- 스크롤상 가장 마지막 줄로, 캐럿도 거기 깜빡여야 함
    // (2026-10-08 사용자 지적: focus()를 아예 뺐더니 스크롤은 되지만 캐럿이
    // 안 따라와서 "맨 아래 입력값 바로 다음 줄"이 아니라 엉뚱한 자리에
    // 캐럿이 남아있는 것처럼 보였음). 빈 줄 생성/캐럿 이동 로직은 빈
    // 영역 클릭 시 쓰던 focusNewLineAtEnd()를 그대로 재사용 -- 이게 캐럿을
    // "먼저" 정확한 위치로 옮겨준 뒤 focus()하므로, 그 전 버전에서 문제였던
    // "포커스가 옛 캐럿 위치로 화면을 되돌리는" 충돌이 애초에 발생하지 않음
    // (캐럿 자체가 이미 목표 위치에 있으므로).
    closeHintPopover();
    suppressAutoJump = true;
    focusNewLineAtEnd();
    suppressAutoJump = false;
    // 아직 한 번도 타이핑을 안 한 상태라면 "새 페이지" 여백(loadAllNotes
    // 참고)이 안 지워져 있을 수 있다 -- 그 여백은 보통 실제 입력(input
    // 이벤트)이 있어야 지워지는데, 여긴 DOM을 직접 조작해서 캐럿만 옮기는
    // 거라 input 이벤트가 안 뜸. 안 지우면 아래 스크롤 계산이 이 여백까지
    // 포함해서 틀어진다.
    if (noteScroll.style.paddingBottom) noteScroll.style.paddingBottom = '';
    if (!typingNode) return;
    // scrollNodeIntoView() 재사용(위 jumpToTypingNode 쪽 설명 참고) --
    // requestAnimationFrame으로 한 틱 늦춰서 focusNewLineAtEnd()가 만든 새
    // 줄의 레이아웃이 확정된 뒤 측정하도록 한다.
    requestAnimationFrame(() => scrollNodeIntoView(typingNode));
  }

  // 입력 중 자동 복귀(포커스/타이핑 시) -- 지금 타이핑하고 있는 자리로
  // 스크롤해야 하므로 jumpToTypingNode를 그대로 재사용. 단, 위 두 함수가
  // 스스로 noteBody.focus()를 호출하는 동안에는 건너뛴다(suppressAutoJump).
  function jumpToLive() {
    if (suppressAutoJump) return;
    jumpToTypingNode();
  }

  // 필기창에 다시 포커스/입력이 들어오면(= 필기입력모드 재개) 최신 위치로 스냅
  noteBody.addEventListener('focus', jumpToLive);
  noteBody.addEventListener('input', jumpToLive);
</script>

</body>
</html>
